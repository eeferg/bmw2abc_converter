[project]
name = "bww-abc"
version = "0.1.0"
description = "Convert between Bagpipe Music Writer (.bww) files and ABC music notation"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bww2abc = "bww_abc:main"
abc2bww = "bww_abc.abc2bww:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bww_abc"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
